# Escalop Workshop: builds the Windows x64 installer and the macOS universal app.
# Same chain as build_all.yml (cache check -> dependencies -> app), without the
# Linux, Flatpak, Windows ARM and unit-test jobs OrcaSlicer runs upstream.
name: Escalop Workshop build

on:
  push:
    branches:
      - escalop
    paths:
      - 'deps/**'
      - 'src/**'
      - '**/CMakeLists.txt'
      - 'version.inc'
      - 'localization/**'
      - 'resources/**'
      - '.github/workflows/build_*.yml'
      - '.github/workflows/escalop_build.yml'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows:
    name: Build Windows x64
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: windows-latest
      arch: x64
    secrets: inherit
  build_macos_arch:
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x86_64]
    uses: ./.github/workflows/build_check_cache.yml
    with:
      os: macos-14
      arch: ${{ matrix.arch }}
    secrets: inherit
  build_macos_universal:
    name: Build macOS Universal
    needs: build_macos_arch
    if: ${{ !cancelled() && needs.build_macos_arch.result == 'success' }}
    uses: ./.github/workflows/build_orca.yml
    with:
      os: macos-14
      arch: universal
      macos-combine-only: true
    secrets: inherit
