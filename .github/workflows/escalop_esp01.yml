# Escalop v80 Wi-Fi module (ESP-01): builds tools/escaloplab/esp01 with PlatformIO.
# Artifact:
#   EscalopV80_WiFi_<version>.bin     first installation with a USB-serial adapter (esptool / Arduino IDE)
#   EscalopV80_WiFi_<version>.bin.gz  the release asset the modules update themselves from (tag wifi-v<version>)
name: Escalop v80 Wi-Fi module

on:
  push:
    branches:
      - escalop
    paths:
      - 'tools/escaloplab/esp01/**'
      - '.github/workflows/escalop_esp01.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: tools/escaloplab/esp01
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-esp8266-${{ hashFiles('tools/escaloplab/esp01/platformio.ini') }}

      - name: Build
        run: |
          pip install --quiet platformio
          pio run

      - name: Package
        id: package
        run: |
          version=$(sed -n 's/^#define WIFI_VERSION "\(.*\)"/\1/p' EscalopWiFi/config.h)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          mkdir -p out
          cp .pio/build/esp01/firmware.bin "out/EscalopV80_WiFi_${version}.bin"
          gzip -9 -n -c .pio/build/esp01/firmware.bin > "out/EscalopV80_WiFi_${version}.bin.gz"
          ls -l out

      - uses: actions/upload-artifact@v4
        with:
          name: EscalopV80_WiFi_${{ steps.package.outputs.version }}
          path: tools/escaloplab/esp01/out/*

      # Every new WIFI_VERSION pushed to escalop is published as wifi-v<version>: all modules install it by themselves
      # within a day (they check at power-on, daily and on "Check for updates"). Already published = nothing to do.
      - name: Publish for the modules
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.package.outputs.version }}
        run: |
          if gh release view "wifi-v${VERSION}" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "wifi-v${VERSION} is already published"; exit 0
          fi
          printf 'Escaloplab v80 Wi-Fi module %s\n\nThe Wi-Fi module installs this by itself; the printer keeps running.\n' "$VERSION" > notes.md
          gh release create "wifi-v${VERSION}" -R "$GITHUB_REPOSITORY" --latest=false --target "$GITHUB_SHA" \
            --title "v80 Wi-Fi module ${VERSION}" --notes-file notes.md "out/EscalopV80_WiFi_${VERSION}.bin.gz"
