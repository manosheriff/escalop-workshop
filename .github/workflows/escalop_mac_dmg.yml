# TripleF3D: packs the Apple-chip (arm64) Mac app of an earlier build run into a .dmg, for when GitHub has no
# Intel Mac runner for the universal build. To use: set RUN_ID (the escalop_build.yml run) and VERSION, push to escalop.
# The .dmg comes out as the artifact TripleF3D_Mac_arm64_<runner>; attach it to the release by hand.
name: TripleF3D Apple-chip dmg

on:
  push:
    branches:
      - escalop
    paths:
      - '.github/workflows/escalop_mac_dmg.yml'

env:
  RUN_ID: '45799788453'
  VERSION: '1.3.9'

permissions:
  actions: read
  contents: read

jobs:
  dmg:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15-intel, macos-14]   # any Mac can make the dmg; two pools in case one has no free runner
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: OrcaSlicer_Mac_bundle_arm64_*
          path: bundle
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}

      - name: Make the dmg
        run: |
          tar -xzf "$(find bundle -name '*.tar.gz' -print -quit)" -C .
          lipo -archs OrcaSlicer/OrcaSlicer.app/Contents/MacOS/OrcaSlicer
          mkdir dmg
          # Same layout as the universal dmg: the app shows as "TripleF3D" in Applications
          cp -R OrcaSlicer/OrcaSlicer.app "dmg/TripleF3D.app"
          ln -s /Applications dmg/Applications
          for i in 1 2 3; do hdiutil create -volname "TripleF3D" -srcfolder dmg -ov -format UDZO \
            "TripleF3D_Mac_AppleChip_V${VERSION}.dmg" && break; sleep 10; done
          hdiutil verify "TripleF3D_Mac_AppleChip_V${VERSION}.dmg"

      - uses: actions/upload-artifact@v7
        with:
          name: TripleF3D_Mac_arm64_${{ matrix.os }}
          path: TripleF3D_Mac_AppleChip_V*.dmg
