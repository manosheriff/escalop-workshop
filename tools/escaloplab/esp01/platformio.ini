; Builds the ESP-01 Wi-Fi module's software (the same sketch the Arduino IDE opens: EscalopWiFi/EscalopWiFi.ino).
;   pio run            -> .pio/build/esp01/firmware.bin
; Arduino IDE equivalent: board "Generic ESP8266 Module", Flash size "1MB (FS:none OTA:~502KB)",
; Flash mode "DOUT", CPU 160 MHz, library "ArduinoJson" 7.x.

[platformio]
src_dir = EscalopWiFi
default_envs = esp01

[env:esp01]
platform = espressif8266@4.2.1
board = esp01_1m
framework = arduino
board_build.flash_mode = dout
board_build.f_cpu = 160000000L
; 1 MB flash, no file system: the space after the program holds new printer firmware and the module's own updates
board_build.ldscript = eagle.flash.1m.ld
lib_deps = bblanchon/ArduinoJson@7.2.1
build_flags = -Wall -Wno-unused-function
